<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
  /* ---- Local Fonts ---- */
  @font-face { font-family:'Space Grotesk'; font-style:normal; font-weight:500; src:url('fonts/sg500.ttf') format('truetype'); }
  @font-face { font-family:'Space Grotesk'; font-style:normal; font-weight:600; src:url('fonts/sg600.ttf') format('truetype'); }
  @font-face { font-family:'Space Grotesk'; font-style:normal; font-weight:700; src:url('fonts/sg700.ttf') format('truetype'); }
  @font-face { font-family:'Inter'; font-style:normal; font-weight:400; src:url('fonts/inter400.ttf') format('truetype'); }
  @font-face { font-family:'Inter'; font-style:normal; font-weight:500; src:url('fonts/inter500.ttf') format('truetype'); }
  @font-face { font-family:'Inter'; font-style:normal; font-weight:600; src:url('fonts/inter600.ttf') format('truetype'); }

  /* ---- Design Tokens ---- */
  :root {
    --accent: #E8A020;
    --accent-r: 232;
    --accent-g: 160;
    --accent-b: 32;
    --accent-dim: rgba(232, 160, 32, 0.12);
    --accent-glow: rgba(232, 160, 32, 0.25);
    --accent-border: rgba(232, 160, 32, 0.3);
    --accent-bg: rgba(232, 160, 32, 0.06);
    --bg: #080808;
    --bg-card: #111111;
    --text-primary: #FFFFFF;
    --text-secondary: rgba(255,255,255,0.55);
    --text-dim: rgba(255,255,255,0.3);
    --divider: rgba(255,255,255,0.06);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: #000;
    font-family: 'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif;
  }

  .canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: var(--bg);
  }

  /* ============================================
     BACKGROUND EFFECTS
     ============================================ */
  .bg-glow-tr {
    position: absolute;
    width: 1000px;
    height: 1000px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--accent-dim) 0%, transparent 70%);
    top: -350px;
    right: -300px;
    pointer-events: none;
  }
  .bg-glow-bl {
    position: absolute;
    width: 700px;
    height: 700px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(var(--accent-r),var(--accent-g),var(--accent-b),0.05) 0%, transparent 70%);
    bottom: -200px;
    left: -250px;
    pointer-events: none;
  }
  .bg-grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px);
    background-size: 80px 80px;
    pointer-events: none;
    z-index: 1;
  }
  .grain {
    position: absolute;
    inset: -50%;
    width: 200%;
    height: 200%;
    filter: url(#noiseFilter);
    opacity: 0.035;
    pointer-events: none;
    z-index: 1;
  }
  .accent-line {
    position: absolute;
    width: 2px;
    height: 520px;
    background: linear-gradient(to bottom, transparent 0%, var(--accent-glow) 30%, var(--accent) 50%, var(--accent-glow) 70%, transparent 100%);
    top: 240px;
    right: 72px;
    transform: rotate(12deg);
    opacity: 0.25;
    pointer-events: none;
    z-index: 1;
  }
  .accent-line::before,
  .accent-line::after {
    content: '';
    position: absolute;
    width: 24px;
    height: 1px;
    background: var(--accent);
    opacity: 0.4;
    left: -11px;
  }
  .accent-line::before { top: 45%; }
  .accent-line::after { top: 55%; }

  /* ============================================
     MAIN CONTENT
     ============================================ */
  .content {
    position: relative;
    z-index: 2;
    width: 100%;
    height: 100%;
    padding: 80px 72px 64px;
    display: flex;
    flex-direction: column;
  }

  .category-label {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 17px;
    letter-spacing: 4.5px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 44px;
    flex-shrink: 0;
  }
  .category-label::before {
    content: '';
    display: block;
    width: 36px;
    height: 2.5px;
    background: var(--accent);
    border-radius: 2px;
  }

  .product-name {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 96px;
    line-height: 1.0;
    color: var(--text-primary);
    text-transform: uppercase;
    letter-spacing: -2px;
    margin-bottom: 22px;
    flex-shrink: 0;
  }

  .tagline {
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    font-size: 33px;
    color: var(--text-secondary);
    line-height: 1.45;
    margin-bottom: 48px;
    max-width: 820px;
    flex-shrink: 0;
  }

  .image-container {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-bottom: 48px;
    position: relative;
  }
  .image-wrapper {
    position: relative;
    width: 760px;
    height: 680px;
    border-radius: 20px;
    overflow: hidden;
    background: var(--bg-card);
  }
  .image-wrapper::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 20px;
    box-shadow: 0 0 100px var(--accent-dim), 0 40px 80px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.04);
    pointer-events: none;
    z-index: 3;
  }
  .image-border-accent {
    position: absolute;
    top: -1px;
    left: -1px;
    width: 120px;
    height: 120px;
    border-top: 3px solid var(--accent);
    border-left: 3px solid var(--accent);
    border-radius: 20px 0 0 0;
    z-index: 4;
    pointer-events: none;
    opacity: 0.6;
  }
  .product-image {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* Price */
  .price-divider {
    width: 80px;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), transparent);
    border-radius: 2px;
    margin: 0 auto 36px;
    flex-shrink: 0;
  }
  .price-section {
    text-align: center;
    margin-bottom: 40px;
    flex-shrink: 0;
  }
  .price {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 108px;
    color: var(--accent);
    line-height: 1;
    letter-spacing: -2px;
  }
  .price-unit {
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 28px;
    color: var(--accent);
    opacity: 0.7;
    margin-left: 6px;
    letter-spacing: 1px;
  }
  .price-label {
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 18px;
    color: var(--text-dim);
    letter-spacing: 3.5px;
    text-transform: uppercase;
    margin-top: 10px;
  }

  /* Feature badge */
  .feature-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 20px 44px;
    border: 1.5px solid var(--accent-border);
    border-radius: 100px;
    background: var(--accent-bg);
    align-self: center;
    flex-shrink: 0;
  }
  .feature-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
    box-shadow: 0 0 8px var(--accent-glow);
  }
  .feature-text {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 25px;
    color: var(--text-primary);
    letter-spacing: 0.3px;
  }

  /* Bottom bar */
  .bottom-bar {
    margin-top: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 28px;
    border-top: 1px solid var(--divider);
    flex-shrink: 0;
  }
  .cta-group {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .cta-text {
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 21px;
    color: var(--text-dim);
    letter-spacing: 0.5px;
  }
  .cta-arrow {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    border: 1.5px solid var(--accent-border);
    border-radius: 50%;
    color: var(--accent);
    font-size: 18px;
    font-weight: 600;
  }
  .brand-mark {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 500;
    font-size: 16px;
    color: var(--text-dim);
    letter-spacing: 7px;
    text-transform: uppercase;
  }

  /* Corner accents */
  .corner-tr {
    position: absolute;
    top: 56px;
    right: 72px;
    width: 48px;
    height: 48px;
    border-top: 1.5px solid rgba(255,255,255,0.06);
    border-right: 1.5px solid rgba(255,255,255,0.06);
    z-index: 2;
  }
  .corner-bl {
    position: absolute;
    bottom: 56px;
    left: 72px;
    width: 48px;
    height: 48px;
    border-bottom: 1.5px solid rgba(255,255,255,0.06);
    border-left: 1.5px solid rgba(255,255,255,0.06);
    z-index: 2;
  }
</style>
</head>
<body>

<svg style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
  <defs>
    <filter id="noiseFilter">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
</svg>

<div class="canvas">
  <div class="bg-glow-tr"></div>
  <div class="bg-glow-bl"></div>
  <div class="bg-grid"></div>
  <div class="grain"></div>
  <div class="accent-line"></div>
  <div class="corner-tr"></div>
  <div class="corner-bl"></div>

  <div class="content">
    <div class="category-label">Premium Hardware</div>

    <div class="product-name">Industrial Ball<br>Valve 2&quot;</div>

    <div class="tagline">Built Tough for Every Job Site</div>

    <div class="image-container">
      <div class="image-wrapper">
        <div class="image-border-accent"></div>
        <img class="product-image" src="assets/valve_product.jpg" alt="Industrial Brass Ball Valve">
      </div>
    </div>

    <div class="price-divider"></div>

    <div class="price-section">
      <div class="price">₹1,250<span class="price-unit"> / piece</span></div>
      <div class="price-label">Best Price</div>
    </div>

    <div class="feature-badge">
      <span class="feature-dot"></span>
      <span class="feature-text">ISI Certified · Heavy Duty</span>
    </div>

    <div class="bottom-bar">
      <div class="cta-group">
        <span class="cta-text">WhatsApp to Order</span>
        <span class="cta-arrow">→</span>
      </div>
      <div class="brand-mark">Savoir AI</div>
    </div>
  </div>
</div>
</body>
</html>
