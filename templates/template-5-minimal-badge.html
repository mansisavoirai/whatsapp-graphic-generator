<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<!--
  Template 5: Minimal Badge (v2 — revised)
  Savoir AI — WhatsApp Product Graphic Generator
  Dimensions: 1080 × 1920px (vertical, WhatsApp Status)

  DESIGN: Extreme restraint and negative space. Quiet luxury —
  MoMA gift shop, Hermès product page, museum exhibition label.
  The ONE bold element is a circular badge/seal containing
  the price. Everything else is whisper-quiet.

  FONTS: Cormorant Garamond (Google Fonts, classic serif) +
         Inter (local TTF, understated sans + ₹ glyph support)

  DYNAMIC DATA SLOTS (search DATA:):
  <!-- DATA: product-name -->
  <!-- DATA: tagline -->
  <!-- DATA: product-image -->
  <!-- DATA: price -->
  <!-- DATA: feature-text -->
  <!-- DATA: cta-text -->
  <!-- DATA: brand -->
-->
<style>
  /* ---- Google Font: Classic Serif ---- */
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap');

  /* ---- Local Fonts ---- */
  @font-face { font-family:'Inter'; font-style:normal; font-weight:300; src:url('fonts/inter300.ttf') format('truetype'); }
  @font-face { font-family:'Inter'; font-style:normal; font-weight:400; src:url('fonts/inter400.ttf') format('truetype'); }
  @font-face { font-family:'Inter'; font-style:normal; font-weight:500; src:url('fonts/inter500.ttf') format('truetype'); }
  @font-face { font-family:'Inter'; font-style:normal; font-weight:600; src:url('fonts/inter600.ttf') format('truetype'); }

  /* ---- Design Tokens ---- */
  :root {
    --bg: #FAF8F4;
    --text-primary: #1C1917;
    --text-secondary: #78716C;
    --text-tertiary: #A8A29E;
    --rule: rgba(28,25,23,0.08);
    --rule-light: rgba(28,25,23,0.05);
    --badge-color: #7C5E10;
    --badge-ring: rgba(255,255,255,0.22);
    --badge-ring-inner: rgba(255,255,255,0.14);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: var(--bg);
    font-family: 'Inter', 'Helvetica Neue', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .canvas {
    position: absolute;
    top: 0; left: 0;
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: var(--bg);
  }

  /* Paper-grain texture — extremely subtle */
  .grain {
    position: absolute;
    inset: -50%;
    width: 200%; height: 200%;
    filter: url(#paperGrain);
    opacity: 0.02;
    pointer-events: none;
    z-index: 1;
  }

  /* ============================================
     CONTENT LAYOUT — centered column
     ============================================ */
  .content {
    position: relative;
    z-index: 2;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 140px;
  }

  /* ---- Category label ---- */
  .category-label {
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 10.5px;
    letter-spacing: 5.5px;
    text-transform: uppercase;
    color: var(--text-tertiary);
    margin-top: 330px;
    margin-bottom: 52px;
    flex-shrink: 0;
  }

  /* ============================================
     PRODUCT IMAGE AREA
     500×500, no border — product floats on cream
     ============================================ */
  .image-area {
    position: relative;
    width: 500px;
    height: 500px;
    flex-shrink: 0;
    margin-bottom: 130px; /* clear badge overhang + breathing room */
  }

  .product-image {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    /* No border, no container — product floats on cream */
  }

  /* SVG fallback — transparent bg, floats on cream */
  .svg-fallback {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: none;
    align-items: center;
    justify-content: center;
    /* No border, no bg — pure float */
  }
  .svg-fallback svg {
    width: 180px; height: 180px;
    opacity: 0.06;
  }

  /* ============================================
     THE BADGE / SEAL — the ONE bold element
     220px circle, bottom-right corner overlap
     like a certification stamp on the product
     ============================================ */
  .badge {
    position: absolute;
    bottom: -50px;
    right: -50px;
    width: 220px;
    height: 220px;
    border-radius: 50%;
    background: var(--badge-color);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 3;
    border: 2px solid var(--badge-ring);
    /* Lift shadow — soft, not harsh */
    box-shadow:
      0 12px 40px rgba(0,0,0,0.12),
      0 4px 12px rgba(0,0,0,0.05),
      inset 0 2px 3px rgba(255,255,255,0.14),
      inset 0 -2px 4px rgba(0,0,0,0.10);
  }

  /* Inner ring — seal detail */
  .badge::before {
    content: '';
    position: absolute;
    inset: 14px;
    border-radius: 50%;
    border: 1px solid var(--badge-ring-inner);
    pointer-events: none;
  }

  /* Decorative dot at top — cardinal point */
  .badge::after {
    content: '';
    position: absolute;
    top: 7px;
    left: 50%;
    transform: translateX(-50%);
    width: 3.5px;
    height: 3.5px;
    border-radius: 50%;
    background: var(--badge-ring);
    pointer-events: none;
  }

  /* ₹ symbol — MUST use Inter (has ₹ glyph U+20B9) */
  .badge-currency {
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 26px;
    color: rgba(255,255,255,0.72);
    line-height: 1;
    margin-bottom: -3px;
  }

  /* Price amount — elegant serif numerals */
  .badge-amount {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 54px;
    color: #FFFFFF;
    line-height: 1;
    letter-spacing: -1px;
  }

  /* Unit label — tracked-out micro uppercase */
  .badge-unit {
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    font-size: 8.5px;
    color: rgba(255,255,255,0.55);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-top: 6px;
  }

  /* ============================================
     PRODUCT NAME — classic serif, modest size
     ============================================ */
  .product-name {
    font-family: 'Cormorant Garamond', 'Georgia', serif;
    font-weight: 600;
    font-size: 66px;
    line-height: 1.12;
    color: var(--text-primary);
    text-align: center;
    letter-spacing: -0.3px;
    margin-bottom: 32px;
    flex-shrink: 0;
  }

  /* ---- Whisper-thin rule ---- */
  .rule {
    width: 560px;
    height: 0.5px;
    background: var(--rule);
    flex-shrink: 0;
    margin-bottom: 30px;
  }

  /* ---- Tagline — italic serif ---- */
  .tagline {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 400;
    font-style: italic;
    font-size: 24px;
    line-height: 1.55;
    color: var(--text-secondary);
    text-align: center;
    margin-bottom: 22px;
    flex-shrink: 0;
  }

  /* ---- Feature — tracked-out sans ---- */
  .feature-text {
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 10.5px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--text-tertiary);
    text-align: center;
    flex-shrink: 0;
  }

  /* ---- Spacer — negative space ---- */
  .spacer { flex: 1; }

  /* ============================================
     QUIET BOTTOM ANCHOR
     One small grounding element so the bottom
     40% doesn't feel unfinished
     ============================================ */
  .anchor {
    text-align: center;
    padding-bottom: 0;
    flex-shrink: 0;
    opacity: 0.45;
  }
  .anchor-text {
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    font-size: 10px;
    letter-spacing: 2.5px;
    color: var(--text-tertiary);
  }

  /* ============================================
     BOTTOM BAR — museum-label frame
     ============================================ */
  .bottom-area {
    width: 100%;
    flex-shrink: 0;
    padding-top: 28px;
    padding-bottom: 52px;
  }

  .bottom-rule {
    width: 100%;
    height: 0.5px;
    background: var(--rule-light);
    margin-bottom: 24px;
  }

  .bottom-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .cta-text {
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 12.5px;
    letter-spacing: 0.2px;
    color: var(--text-secondary);
  }

  .brand-mark {
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 10px;
    letter-spacing: 4.5px;
    text-transform: uppercase;
    color: var(--text-tertiary);
  }
</style>
</head>
<body>

<!-- SVG noise filter for paper grain -->
<svg style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
  <defs>
    <filter id="paperGrain">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
</svg>

<div class="canvas">
  <!-- Paper-grain texture -->
  <div class="grain"></div>

  <div class="content">

    <!-- Category label -->
    <div class="category-label">Premium Hardware</div>

    <!-- Product image with badge seal -->
    <div class="image-area">
      <!-- DATA: product-image -->
      <img class="product-image"
           src="assets/valve_product.jpg"
           alt="Industrial Brass Ball Valve"
           onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
      <div class="svg-fallback">
        <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="40" y="80" width="120" height="40" rx="6" stroke="#1C1917" stroke-width="1.5"/>
          <circle cx="100" cy="100" r="16" stroke="#1C1917" stroke-width="1.5"/>
          <line x1="40" y1="100" x2="24" y2="100" stroke="#1C1917" stroke-width="1.5"/>
          <line x1="160" y1="100" x2="176" y2="100" stroke="#1C1917" stroke-width="1.5"/>
          <rect x="88" y="56" width="24" height="44" rx="4" fill="#1C1917" opacity="0.06"/>
          <rect x="82" y="48" width="36" height="12" rx="4" fill="#1C1917" opacity="0.04"/>
        </svg>
      </div>

      <!-- THE BADGE / SEAL — bottom-right certification stamp -->
      <div class="badge">
        <!-- ₹ MUST use Inter — Cormorant lacks U+20B9 -->
        <span class="badge-currency">&#8377;</span>
        <!-- DATA: price-amount -->
        <span class="badge-amount">1,250</span>
        <span class="badge-unit">Per Piece</span>
      </div>
    </div>

    <!-- DATA: product-name -->
    <div class="product-name">Industrial Ball Valve 2&#8243;</div>

    <div class="rule"></div>

    <!-- DATA: tagline -->
    <div class="tagline">Built Tough for Every Job Site</div>

    <!-- DATA: feature-text -->
    <div class="feature-text">ISI Certified · Heavy Duty</div>

    <!-- Negative space -->
    <div class="spacer"></div>

    <!-- Quiet bottom anchor — grounds the composition -->
    <div class="anchor">
      <span class="anchor-text">Crafted in India · Est. 2024</span>
    </div>

    <!-- Museum-label bottom frame -->
    <div class="bottom-area">
      <div class="bottom-rule"></div>
      <div class="bottom-bar">
        <!-- DATA: cta-text -->
        <span class="cta-text">WhatsApp to Order</span>
        <!-- DATA: brand -->
        <span class="brand-mark">Savoir AI</span>
      </div>
    </div>

  </div>
</div>

<!-- ============================================
     COLOR EXTRACTION
     Extracted color used ONLY for badge background.
     Darkens to ~55%, WCAG AA enforced.
     ============================================ -->
<script>
function extractBadgeColor(img) {
  try {
    var c = document.createElement('canvas'),
        x = c.getContext('2d'),
        s = 64;
    c.width = s; c.height = s;
    x.drawImage(img, 0, 0, s, s);
    var d = x.getImageData(0, 0, s, s).data,
        rS = 0, gS = 0, bS = 0, n = 0;

    for (var i = 0; i < d.length; i += 16) {
      var r = d[i], g = d[i+1], b = d[i+2],
          br = (r + g + b) / 3;
      if (br > 25 && br < 230) {
        var mx = Math.max(r, g, b), mn = Math.min(r, g, b),
            sa = mx === 0 ? 0 : (mx - mn) / mx;
        if (sa > 0.08) { rS += r; gS += g; bS += b; n++; }
      }
    }

    if (n < 10) {
      for (var i = 0; i < d.length; i += 16) {
        var r = d[i], g = d[i+1], b = d[i+2],
            br = (r + g + b) / 3;
        if (br > 30 && br < 225) { rS += r; gS += g; bS += b; n++; }
      }
    }

    if (n > 0) {
      var rA = Math.round(rS / n),
          gA = Math.round(gS / n),
          bA = Math.round(bS / n);

      var mx = Math.max(rA, gA, bA),
          mn = Math.min(rA, gA, bA),
          md = (mx + mn) / 2;
      if (mx !== mn) {
        rA = Math.min(255, Math.round((rA - md) * 1.3 + md));
        gA = Math.min(255, Math.round((gA - md) * 1.3 + md));
        bA = Math.min(255, Math.round((bA - md) * 1.3 + md));
      }

      var dk = 0.55,
          rD = Math.round(rA * dk),
          gD = Math.round(gA * dk),
          bD = Math.round(bA * dk);

      function relLuminance(r, g, b) {
        var rs = r / 255, gs = g / 255, bs = b / 255;
        rs = rs <= 0.03928 ? rs / 12.92 : Math.pow((rs + 0.055) / 1.055, 2.4);
        gs = gs <= 0.03928 ? gs / 12.92 : Math.pow((gs + 0.055) / 1.055, 2.4);
        bs = bs <= 0.03928 ? bs / 12.92 : Math.pow((bs + 0.055) / 1.055, 2.4);
        return 0.2126 * rs + 0.7152 * gs + 0.0722 * bs;
      }

      var lum = relLuminance(rD, gD, bD);
      if (lum > 0.18) {
        var sc = 0.18 / lum;
        rD = Math.round(Math.min(255, rD * sc));
        gD = Math.round(Math.min(255, gD * sc));
        bD = Math.round(Math.min(255, bD * sc));
      }

      var color = 'rgb(' + rD + ',' + gD + ',' + bD + ')';
      document.documentElement.style.setProperty('--badge-color', color);
    }
  } catch(e) {}
}

document.addEventListener('DOMContentLoaded', function() {
  var img = document.querySelector('.image-area .product-image');
  if (img && img.complete && img.naturalWidth > 0) {
    extractBadgeColor(img);
  } else if (img) {
    img.addEventListener('load', function() { extractBadgeColor(this); });
  }
});
</script>
</body>
</html>
